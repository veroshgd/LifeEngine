[pytest]
# ★ Why this file is needed ★
# The repository holds three copies of the same module names: the root directory, v2_frozen/ and
# v3_frozen/ each have a `p1_test.py` / `p2_test.py` / `relaxation_test.py` / `rule48_test.py` /
# `test_022_regression.py`. pytest derives module names from the basename, so this gives
# `import file mismatch` — 10 collection errors and not a single test collected.
#
# It cannot be solved by editing the frozen directories: those two carry SHA256SUMS.txt, and editing
# them breaks the freeze. So the collection scope is restricted here in the root instead.
#
# Also: those `*_test.py` files in the root are **not pytest tests**, they are experiment scripts
# (each takes tens of minutes of simulation to run). Restricting testpaths also keeps them from
# being collected by mistake.

testpaths = tests
norecursedirs = v2_frozen v3_frozen __pycache__ .git
addopts = -q
